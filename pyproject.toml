[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fvn-translator"
version = "0.1.0"
description = "Extensible FTIF-based translation framework for furry visual novels"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "keyring>=25.5,<26", "textual>=1.0,<2", "platformdirs>=4.3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "pyright>=1.1.390,<2", "jsonschema>=4.23,<5"]

[project.scripts]
fvn-translator = "fvn_translator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fvn_translator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "main.py", "scripts"]
exclude = ["trash"]
